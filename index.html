<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171513">
  <title>Странные Вещи — запись</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">СТРАННЫЕ ВЕЩИ</p>
      <h1>Запись в мастерскую</h1>
      <p class="hello" id="hello">Добро пожаловать</p>
    </header>

    <section class="card">
      <h2>Что хотите выбрать?</h2>
      <div class="choices">
        <button class="choice" type="button" data-action="diogen">
          <span class="choice-icon">◌</span>
          <span><strong>Диоген</strong><small>Побыть в мастерской, поработать или просто посидеть</small></span>
        </button>
        <button class="choice" type="button" data-action="masterclass">
          <span class="choice-icon">✦</span>
          <span><strong>Мастер-класс</strong><small>Сделать вещь своими руками вместе с мастером</small></span>
        </button>
      </div>
    </section>

    <section class="card calendar-card">
      <div class="section-head">
        <div>
          <p class="eyebrow">КАЛЕНДАРЬ</p>
          <h2>Ближайшие дни</h2>
        </div>
        <span class="demo-badge">ДЕМО</span>
      </div>

      <div class="legend">
        <span><i class="dot free"></i> свободно</span>
        <span><i class="dot dio"></i> Диоген</span>
        <span><i class="dot mk"></i> МК</span>
        <span><i class="dot closed"></i> закрыто</span>
      </div>

      <div id="calendar" class="calendar"></div>
    </section>

    <section id="message" class="notice hidden"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
