<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Странные Вещи — запись</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="stylesheet" href="calendar-fix.css?v=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <section class="card">
      <h2 style="text-align: center;">Что хотите выбрать?</h2>
      <div id="activities" class="choices">
        <div class="loading-activities">Загрузка...</div>
      </div>
    </section>

    <section class="card calendar-card">
      <div class="section-head">
        <div>
          <h2>Календарь</h2>
        </div>
      </div>

      <div class="legend">
        <span><i class="dot free"></i> свободно</span>
        <span><i class="dot dio"></i> Диоген</span>
        <span><i class="dot mk"></i> МК</span>
        <span><i class="dot closed"></i> закрыто</span>
        <span><i class="dot discuss"></i> Обсудить заказ</span>
      </div>

      <div id="calendar" class="calendar"></div>
    </section>

    <section id="message" class="notice hidden"></section>
  </main>

  <div id="activity-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="activity-title">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" type="button" aria-label="Закрыть">×</button>
      <div id="activity-image-wrap" class="activity-image-wrap hidden">
        <img id="activity-image" class="activity-image" alt="">
      </div>
      <p class="eyebrow">ПОДРОБНЕЕ</p>
      <h2 id="activity-title"></h2>
      <p id="activity-description"></p>
      <button id="modal-ok" class="modal-ok" type="button">Понятно</button>
    </div>
  </div>

  <div id="events-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="events-title">
    <div class="events-modal-content">
      <button id="events-close" class="modal-close" type="button" aria-label="Закрыть">×</button>
      <p class="eyebrow">ВЫБЕРИТЕ</p>
      <h2 id="events-title"></h2>
      <div id="events-list" class="events-list"></div>
    </div>
  </div>

  <script src="app.js?v=20260911-2"></script>
</body>
</html>
