<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Странные Вещи — запись</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <section class="card activities-card">
      <div id="activities" class="choices"><div class="loading-activities">Загрузка...</div></div>
    </section>
    <section class="card calendar-card">
      <div class="section-head"><div><h2 id="calendar-prompt" class="calendar-prompt">Выберите ↑</h2></div></div>
      <div id="activity-legend" class="legend"></div>
      <div id="calendar" class="calendar"></div>
    </section>
  </main>

  <div id="global-loader" class="global-loader hidden" aria-hidden="true">
    <div class="global-spinner"></div>
    <div id="global-loader-text" class="global-loader-text"></div>
  </div>

  <div id="activity-modal" class="modal activity-modal hidden" role="dialog" aria-modal="true" aria-labelledby="activity-title">
    <div class="modal-content"><button id="modal-close" class="modal-close" type="button" aria-label="Закрыть">×</button>
      <div id="activity-image-wrap" class="activity-image-wrap hidden"><img id="activity-image" class="activity-image" alt=""></div>
      <p class="eyebrow">ПОДРОБНЕЕ</p><h2 id="activity-title"></h2><p id="activity-description"></p><button id="modal-ok" class="modal-ok" type="button">Понятно</button>
    </div>
  </div>

  <div id="events-modal" class="modal events-modal hidden" role="dialog" aria-modal="true" aria-labelledby="events-title">
    <div class="events-modal-content"><button id="events-close" class="modal-close" type="button" aria-label="Закрыть">×</button><p class="eyebrow">ВЫБЕРИТЕ</p><h2 id="events-title"></h2><div id="events-list" class="events-list"></div></div>
  </div>

  <div id="error-modal" class="modal error-modal hidden" role="dialog" aria-modal="true" aria-labelledby="error-title">
    <div class="modal-content error-modal-content"><button class="modal-close" type="button" aria-label="Закрыть" onclick="document.getElementById('error-modal').classList.add('hidden')">×</button><p class="eyebrow">ОШИБКА</p><h2 id="error-title">Не получилось</h2><p id="error-text"></p><button id="error-ok" class="modal-ok" type="button" onclick="window.location.reload()">Перезагрузить</button></div>
  </div>

  <script src="app.js"></script>
  <script>
    (function runBackgroundCalendarNormalization(){
      const url='https://script.google.com/macros/s/AKfycbwpYRqIunVa1uBfMqaf9HY4ICKXeeaCUbYLtoBxYT6e0_tYyBSvgiVfmeU-3SkEC2SqQ/exec';
      const waitForCalendar=()=>{
        if(document.body.classList.contains('app-loading')||!document.querySelector('#calendar .calendar-cell')){
          setTimeout(waitForCalendar,100);
          return;
        }
        fetch(url+'?action=normalize-free&ts='+Date.now(),{cache:'no-store',redirect:'follow'})
          .then(async response=>{
            if(!response.ok)throw Error('HTTP '+response.status);
            const text=await response.text();
            const result=JSON.parse(text);
            if(!result.ok)throw Error(result.error||'Нормализация календаря не выполнена.');
          })
          .catch(error=>console.warn('Фоновая нормализация календаря не выполнена:',error));
      };
      setTimeout(waitForCalendar,0);
    })();
  </script>
</body>
</html>
