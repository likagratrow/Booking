<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Странные Вещи — запись</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    .calendar-head-tools{display:none}
    .my-bookings-button{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:60;padding:8px 11px;color:var(--tg-button-text);background:var(--tg-accent);border:1px solid color-mix(in srgb,var(--tg-accent) 82%,black);border-radius:10px;font-size:12px;font-weight:800;line-height:1;box-shadow:0 4px 14px color-mix(in srgb,var(--tg-accent) 28%,transparent);cursor:pointer}
    .my-bookings-button:active{transform:scale(.97)}
    .my-bookings-modal{z-index:35}
    .my-bookings-content{width:min(520px,100%);max-height:min(82vh,700px);overflow-y:auto}
    .my-bookings-list{display:grid;gap:9px;margin-top:10px}
    .my-booking{padding:11px 11px 10px;color:var(--tg-text);background:var(--tg-secondary-bg);border:2px solid var(--my-booking-color,var(--tg-accent));border-radius:10px}
    .my-booking-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .my-booking-copy{min-width:0}
    .my-booking-activity{font-size:11px;color:var(--tg-hint);line-height:1.2}
    .my-booking-name{margin-top:2px;font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
    .my-booking-meta{margin-top:6px;color:var(--tg-text);font-size:12px;line-height:1.35}
    .my-booking-cancel{flex:0 0 auto;padding:7px 9px;color:var(--tg-text);background:var(--tg-bg);border:1px solid var(--my-booking-color,var(--tg-accent));border-radius:7px;font-size:11px;font-weight:700;cursor:pointer}
    .my-booking-cancel:disabled{opacity:.55;cursor:default}
    .my-bookings-empty,.my-bookings-error{padding:12px 2px;color:var(--tg-hint);font-size:13px;text-align:center}
    @media(max-width:430px){.my-bookings-button{top:max(10px,env(safe-area-inset-top));right:10px;padding:7px 9px;font-size:11px}}
  </style>
</head>
<body>
  <main class="app">
    <section class="card activities-card">
      <div id="activities" class="choices"><div class="loading-activities">Загрузка...</div></div>
    </section>
    <section class="card calendar-card">
      <div class="section-head"><div><h2 id="calendar-prompt" class="calendar-prompt">Выберите ↑</h2></div></div>
      <div id="activity-legend" class="legend"></div>
      <div id="calendar" class="calendar"></div>
    </section>
  </main>

  <button id="my-bookings-button" class="my-bookings-button" type="button">Мои брони</button>


  <div id="activity-modal" class="modal activity-modal hidden" role="dialog" aria-modal="true" aria-labelledby="activity-title">
    <div class="modal-content"><button id="modal-close" class="modal-close" type="button" aria-label="Закрыть">×</button>
      <div id="activity-image-wrap" class="activity-image-wrap hidden"><img id="activity-image" class="activity-image" alt=""></div>
      <p class="eyebrow">ПОДРОБНЕЕ</p><h2 id="activity-title"></h2><p id="activity-description"></p><button id="modal-ok" class="modal-ok" type="button">Понятно</button>
    </div>
  </div>

  <div id="events-modal" class="modal events-modal hidden" role="dialog" aria-modal="true" aria-labelledby="events-title">
    <div class="events-modal-content"><button id="events-close" class="modal-close" type="button" aria-label="Закрыть">×</button><p class="eyebrow">ВЫБЕРИТЕ</p><h2 id="events-title"></h2><div id="events-list" class="events-list"></div></div>
  </div>

  <div id="my-bookings-modal" class="modal my-bookings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="my-bookings-title">
    <div class="modal-content my-bookings-content">
      <button id="my-bookings-close" class="modal-close" type="button" aria-label="Закрыть">×</button>
      <p class="eyebrow">МОИ ЗАПИСИ</p>
      <h2 id="my-bookings-title">Мои брони</h2>
      <div id="my-bookings-list" class="my-bookings-list"></div>
    </div>
  </div>

  <div id="error-modal" class="modal error-modal hidden" role="dialog" aria-modal="true" aria-labelledby="error-title">
    <div class="modal-content error-modal-content"><button class="modal-close" type="button" aria-label="Закрыть" onclick="document.getElementById('error-modal').classList.add('hidden')">×</button><p class="eyebrow">ОШИБКА</p><h2 id="error-title">Не получилось</h2><p id="error-text"></p><button id="error-ok" class="modal-ok" type="button" onclick="window.location.reload()">Перезагрузить</button></div>
  </div>

  <script src="app.js"></script>
  <script>
    (function(){
      function isDiogenKey(key){
        const raw=norm(key);
        const activity=activityByKey(raw)||activities.find(function(a){return norm(a.title)===raw;});
        return Boolean(activity&&norm(activity.key)==='diogen');
      }

      window.openExistingBooking=function(event,clickedDate='',clickedHour=NaN){
        if(!event||eventHasStarted(event))return;
        const name=bookingEventName(event),eventData=eventForContext({name:name});
        if(!eventData)return;
        const occupancy=bookingEventOccupancy(event),free=Math.max(0,Number(occupancy?.capacity||0)-Number(occupancy?.occupied||0));
        if(free<1)return;
        const context={activity:eventData.activity,name:eventData.name};
        const date=eventDate(event),existingStart=eventStartMinutes(event),existingEnd=eventEndMinutes(event);
        if(!date||!Number.isFinite(existingStart)||!Number.isFinite(existingEnd)||existingEnd<=existingStart)return;
        const diogen=isDiogenKey(context.activity);
        const start=diogen&&clickedDate===date&&Number.isFinite(clickedHour)?Math.max(existingStart,Number(clickedHour)*60):existingStart;
        if(start>=existingEnd)return;
        const endOptions=diogen?diogenEndOptions(date,start,context):[existingEnd];
        if(!endOptions.length)return;
        const slot=bookingPayload(date,start,endOptions[endOptions.length-1],context);
        slot.name=eventData.name;
        slot.free=free;
        slot.capacity=Number(occupancy.capacity);
        slot.minTickets=1;
        slot.available=true;
        openBooking(slot,{diogen:diogen,endOptions:endOptions,context:context});
      };
    })();
  </script>
  <script>
    (function(){
      const modal=document.getElementById('my-bookings-modal');
      const list=document.getElementById('my-bookings-list');
      const openButton=document.getElementById('my-bookings-button');
      const closeButton=document.getElementById('my-bookings-close');

      function currentTelegramUser(){return window.Telegram?.WebApp?.initDataUnsafe?.user||null;}
      function bookingEndTime(booking){
        const slot=String(booking?.slotId||'').split('::');
        if(slot.length===4){const raw=slot[3],m=raw.match(/^\d{8}-(\d{2})(\d{2})$/);if(m)return m[1]+':'+m[2];}
        const event=eventForContext({activity:booking.activity,name:booking.name});
        const start=String(booking.time||'').match(/^(\d{1,2}):(\d{2})$/);
        if(!event||!start)return'';
        const minutes=Number(start[1])*60+Number(start[2])+parseDuration(event.duration);
        return timeKey(minutes);
      }
      function bookingLabel(booking){
        const start=String(booking.time||'').trim(),end=bookingEndTime(booking);
        return end?`${formatBookingDate(booking.date)} · ${start}–${end}`:`${formatBookingDate(booking.date)} · ${start}`;
      }
      function activityInfo(booking){
        const activity=activityByKey(booking.activity)||activities.find(function(a){return norm(a.title)===norm(booking.activity);});
        return activity||{key:booking.activity,title:booking.activity,color:''};
      }
      function render(items){
        if(!items.length){list.innerHTML='<div class="my-bookings-empty">Активных броней пока нет.</div>';return;}
        items.sort(function(a,b){return String(a.date).localeCompare(String(b.date),'ru')||String(a.time).localeCompare(String(b.time),'ru');});
        list.innerHTML=items.map(function(booking){
          const activity=activityInfo(booking),color=String(activity.color||'').trim();
          const style=color?` style="--my-booking-color:${esc(color)}"`:'';
          return `<article class="my-booking" data-booking-id="${esc(booking.id)}"${style}>
            <div class="my-booking-main">
              <div class="my-booking-copy">
                <div class="my-booking-activity">${esc(activity.title||booking.activity)}</div>
                <div class="my-booking-name">${esc(booking.name)}</div>
                <div class="my-booking-meta">${esc(bookingLabel(booking))} · ${esc(booking.tickets)} ${Number(booking.tickets)===1?'билет':'билета'}</div>
              </div>
              <button class="my-booking-cancel" type="button" data-cancel-booking="${esc(booking.id)}">Отменить</button>
            </div>
          </article>`;
        }).join('');
        list.querySelectorAll('[data-cancel-booking]').forEach(function(button){
          button.addEventListener('click',function(){cancelBookingFromPopup(String(button.dataset.cancelBooking||''));});
        });
      }
      async function loadMyBookings(){
        const user=currentTelegramUser();
        if(!user?.id){list.innerHTML='<div class="my-bookings-error">Не удалось определить пользователя Telegram.</div>';return;}
        list.innerHTML='<div class="my-bookings-empty">Загружаем брони…</div>';
        try{
          const response=await fetch(BOOKING_API_URL+'?action=bookings&ts='+Date.now(),{cache:'no-store',redirect:'follow'});
          if(!response.ok)throw Error('Сервер вернул HTTP '+response.status+'.');
          const data=await response.json();
          if(!data.ok)throw Error(data.error||'Не удалось загрузить брони.');
          const items=(data.bookings?.items||[]).filter(function(b){return b.status==='active'&&String(b.telegramId)===String(user.id);});
          render(items);
        }catch(error){list.innerHTML=`<div class="my-bookings-error">${esc(error.message||'Не удалось загрузить брони.')}</div>`;}
      }
      async function cancelBookingFromPopup(id){
        if(!id)return;
        const user=currentTelegramUser();
        if(!user?.id)return;
        const button=list.querySelector(`[data-cancel-booking="${CSS.escape(id)}"]`);
        if(button?.dataset.busy==='1')return;
        if(!confirm('Отменить эту бронь?'))return;
        if(button){button.dataset.busy='1';button.disabled=true;button.textContent='Отменяем…';}
        try{
          const response=await fetch(BOOKING_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'cancel',bookingId:id,telegramId:String(user.id)}),redirect:'follow'});
          const text=await response.text();
          let data;try{data=JSON.parse(text);}catch(e){throw Error(`Сервер вернул не JSON: ${text.slice(0,180)}`);}
          if(!data.ok)throw Error(data.error||'Не удалось отменить бронь.');
          await loadBookingData();
          await loadMyBookings();
        }catch(error){
          if(button){button.dataset.busy='';button.disabled=false;button.textContent='Отменить';}
          showError(error.message||'Не удалось отменить бронь.');
        }
      }
      function open(){modal.classList.remove('hidden');loadMyBookings();}
      function close(){modal.classList.add('hidden');}
      openButton?.addEventListener('click',open);
      closeButton?.addEventListener('click',close);
      modal?.addEventListener('click',function(event){if(event.target===modal)close();});
      document.addEventListener('keydown',function(event){if(event.key==='Escape')close();});
    })();
  </script>
  <script>
    (function runBackgroundCalendarNormalization(){
      const url='https://script.google.com/macros/s/AKfycbwpYRqIunVa1uBfMqaf9HY4ICKXeeaCUbYLtoBxYT6e0_tYyBSvgiVfmeU-3SkEC2SqQ/exec';
      const ready=window.bookingCalendarAllRangesReady||window.bookingCalendarFirstRangeReady||Promise.resolve();
      ready.then(()=>fetch(url+'?action=normalize-free&ts='+Date.now(),{cache:'no-store',redirect:'follow'}))
        .then(async response=>{
          if(!response.ok)throw Error('HTTP '+response.status);
          const text=await response.text();
          const result=JSON.parse(text);
          if(!result.ok)throw Error(result.error||'Нормализация календаря не выполнена.');
        })
        .catch(error=>console.warn('Фоновая нормализация календаря не выполнена:',error));
    })();
  </script>
</body>
</html>
